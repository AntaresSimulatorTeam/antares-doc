site_name: Antares
repo_url: https://github.com/AntaresSimulatorTeam/antares-doc
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  logo: assets/logos/logo.png
  favicon: assets/logos/icone.png
  prev_next_buttons_location: none
  features:
    - navigation.instant
    - navigation.instant.preview
    - navigation.top
    # - navigation.sections
    # - navigation.tabs
    - content.tabs.link
    - content.code.copy
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: antares
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

