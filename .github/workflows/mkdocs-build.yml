name: Docs Build Check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@v7.6.0
        with:
          version: "0.13.6"

      - name: Install dependencies with uv
        run: uv sync --locked

      - name: Build MkDocs
        run: uv run --locked mkdocs build --strict
