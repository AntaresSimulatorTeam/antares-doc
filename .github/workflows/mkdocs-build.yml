name: Docs Build Check

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
      
      - name: Install dependencies with uv
        run: uv sync

      - name: Build MkDocs
        run: uv run mkdocs build --strict