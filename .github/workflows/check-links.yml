name: Check links

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # Mondays at 06:00 UTC, on the default branch.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-links:
    name: Local links
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check local Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml --offline README.md AGENTS.md 'docs/**/*.md'
          fail: true
          jobSummary: true

  external-links:
    name: External links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check external Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml --scheme http --scheme https README.md AGENTS.md 'docs/**/*.md'
          fail: true
          jobSummary: true
